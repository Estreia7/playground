<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="320" fill="#09090b"/>
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="800" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181b"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f97316" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" fill="url(#mg)"/>

  <!-- Document sheet -->
  <g transform="translate(300 70)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#fafafa"/>
    <rect x="20" y="26" width="120" height="12" rx="3" fill="#d4d4d8"/>
    <rect x="20" y="52" width="160" height="8" rx="3" fill="#e4e4e7"/>
    <rect x="20" y="70" width="160" height="8" rx="3" fill="#e4e4e7"/>
    <rect x="20" y="88" width="110" height="8" rx="3" fill="#e4e4e7"/>
    <rect x="20" y="118" width="70" height="46" rx="4" fill="#fed7aa"/>
    <rect x="104" y="118" width="76" height="8" rx="3" fill="#e4e4e7"/>
    <rect x="104" y="134" width="76" height="8" rx="3" fill="#e4e4e7"/>
    <rect x="104" y="150" width="50" height="8" rx="3" fill="#e4e4e7"/>
    <!-- scan line -->
    <rect x="-8" y="80" width="216" height="40" fill="url(#scanline)"/>
  </g>

  <!-- Corner brackets (scanner viewfinder) -->
  <g stroke="#f97316" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M276 56 h-24 v24"/>
    <path d="M524 56 h24 v24"/>
    <path d="M276 264 h-24 v-24"/>
    <path d="M524 264 h24 v-24"/>
  </g>

  <text x="60" y="180" font-family="Geist, system-ui, sans-serif" font-size="46" font-weight="700" fill="#fafafa">Monte</text>
  <text x="60" y="228" font-family="Geist, system-ui, sans-serif" font-size="46" font-weight="700" fill="#f97316">Scan</text>
</svg>
