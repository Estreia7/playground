      <stop offset="100%" stop-color="#3ECFB2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="#0B1D21"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- target ring -->
