    <g stroke="#3ECFB2" stroke-width="2" opacity="0.5">
      <line x1="0" y1="-136" x2="0" y2="-124"/>
      <line x1="0" y1="136" x2="0" y2="124"/>
      <line x1="-136" y1="0" x2="-124" y2="0"/>
      <line x1="136" y1="0" x2="124" y2="0"/>
