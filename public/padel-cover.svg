<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Padel">
  <defs>
    <radialGradient id="bg" cx="0.15" cy="0" r="1.1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="0.6" stop-color="#0b1823"/>
      <stop offset="1" stop-color="#070f16"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="232" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c4a63"/>
      <stop offset="1" stop-color="#0b1823"/>
    </linearGradient>
  </defs>
  <style>
    .x{transform:translateX(330px)} .y{transform:translateY(120px)}
    @media (prefers-reduced-motion: no-preference){
      .x{animation:x 3.6s linear infinite}
      .y{animation:y 3.6s linear infinite}
      .t{animation:t 5s ease-in-out infinite}
    }
    @keyframes x{0%,100%{transform:translateX(150px)}50%{transform:translateX(560px)}}
    @keyframes y{
      0%{transform:translateY(168px);animation-timing-function:cubic-bezier(.25,.6,.5,1)}
      14%{transform:translateY(100px);animation-timing-function:cubic-bezier(.5,0,.75,.4)}
      37%{transform:translateY(236px);animation-timing-function:cubic-bezier(.25,.6,.5,1)}
      50%{transform:translateY(168px);animation-timing-function:cubic-bezier(.25,.6,.5,1)}
      64%{transform:translateY(100px);animation-timing-function:cubic-bezier(.5,0,.75,.4)}
      87%{transform:translateY(236px);animation-timing-function:cubic-bezier(.25,.6,.5,1)}
      100%{transform:translateY(168px)}
    }
    @keyframes t{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  </style>
  <rect width="800" height="320" fill="url(#bg)"/>
  <!-- the court, side-on: floor, glass at each end, the net -->
  <rect y="232" width="800" height="88" fill="url(#floor)"/>
  <path d="M0 232.5h800" stroke="#cbed09" stroke-opacity=".5" stroke-width="2"/>
  <rect x="10" y="80" width="18" height="152" rx="3" fill="#cbed09" fill-opacity=".07" stroke="#cbed09" stroke-opacity=".35"/>
  <rect x="772" y="80" width="18" height="152" rx="3" fill="#cbed09" fill-opacity=".07" stroke="#cbed09" stroke-opacity=".35"/>
  <rect x="396" y="168" width="8" height="64" fill="#e4e4e7"/>
  <path d="M388 186h24M388 202h24M388 218h24" stroke="#e4e4e7" stroke-opacity=".35" stroke-width="1.5"/>
  <rect x="388" y="165" width="24" height="6" rx="2" fill="#fff"/>
  <g class="x">
    <ellipse cx="0" cy="234" rx="18" ry="4.4" fill="#000" opacity=".45"/>
    <g class="y">
      <circle r="13" fill="#cbed09"/>
      <path d="M-11.5 -4.5Q-3.5 3 -2 12M11.5 4.5Q3.5 -3 2 -12" fill="none" stroke="#0b1823" stroke-width="2.3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- the logo, on the pale tile it needs on a dark card -->
  <g class="t" style="transform-origin:640px 92px;transform-box:view-box">
    <rect x="574" y="26" width="132" height="132" rx="34" fill="#f3f8e2"/>
    <image href="data:image/png;base64," x="584" y="36" width="112" height="112"/>
  </g>
</svg>
